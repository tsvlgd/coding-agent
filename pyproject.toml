[project]
name = "ai-coding-agent"
version = "0.1.0"
description = "An AI coding agent with tool calling, MCP support, and session persistence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "openai>=3.0,<4",
    "httpx>=0.28,<1",
    "rich>=15.0,<16",
    "tiktoken>=0.8,<1",
    "platformdirs>=4.0,<5",
    "ddgs>=9.0,<10",
    "fastmcp>=2.14,<3",
]

[project.scripts]
agent = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

# --- Build backend -----------------------------------------------------------
# hatchling is used so `uv sync` can build an editable install that points at
# the repo root (see dev-mode-dirs below) instead of copying loose top-level
# modules named `config`, `tools`, `client`, ... into site-packages.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Editable installs add the repo root to sys.path so the flat top-level
# layout (`from agent.agent import Agent`) keeps working unmodified.
dev-mode-dirs = ["."]

packages = [
    "agent",
    "client",
    "config",
    "context",
    "hooks",
    "prompts",
    "safety",
    "tools",
    "ui",
    "utils",
]

[tool.hatch.build.targets.sdist]
include = [
    "/agent",
    "/client",
    "/config",
    "/context",
    "/hooks",
    "/prompts",
    "/safety",
    "/tools",
    "/ui",
    "/utils",
    "/main.py",
    "/README.md",
]

# --- Ruff --------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# prompts/system.py is a large embedded prompt blob, not hand-formatted code.
"prompts/system.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "agent",
    "client",
    "config",
    "context",
    "hooks",
    "prompts",
    "safety",
    "tools",
    "ui",
    "utils",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
asyncio_mode = "auto"
